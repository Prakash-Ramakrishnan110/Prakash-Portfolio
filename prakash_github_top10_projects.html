
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.header { padding: 1.5rem 0 1rem; }
.header h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.header p { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding-bottom: 1rem; }
.card {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 1rem 1.25rem;
  transition: border-color 0.2s;
  cursor: pointer;
}
.card:hover { border-color: var(--color-border-secondary); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); line-height: 1.4; }
.rank { font-size: 11px; font-weight: 500; background: var(--color-background-secondary); color: var(--color-text-secondary); padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
.card-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
.tag-ts   { background: #E6F1FB; color: #0C447C; }
.tag-py   { background: #EAF3DE; color: #27500A; }
.tag-dart { background: #E1F5EE; color: #085041; }
.tag-html { background: #FAECE7; color: #712B13; }
.tag-saas { background: #EEEDFE; color: #3C3489; }
.tag-auto { background: #FAEEDA; color: #633806; }
.tag-ai   { background: #FBEAF0; color: #72243E; }
.tag-n8n  { background: #F1EFE8; color: #444441; }
@media (prefers-color-scheme: dark) {
  .tag-ts   { background: #0C447C; color: #B5D4F4; }
  .tag-py   { background: #27500A; color: #C0DD97; }
  .tag-dart { background: #085041; color: #9FE1CB; }
  .tag-html { background: #712B13; color: #F5C4B3; }
  .tag-saas { background: #3C3489; color: #CECBF6; }
  .tag-auto { background: #633806; color: #FAC775; }
  .tag-ai   { background: #72243E; color: #F4C0D1; }
  .tag-n8n  { background: #444441; color: #D3D1C7; }
}
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.github-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--color-text-secondary);
  text-decoration: none;
  padding: 4px 10px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-md);
  transition: background 0.15s;
}
.github-link:hover { background: var(--color-background-secondary); }
.img-prompt-btn {
  font-size: 11px;
  color: var(--color-text-secondary);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--border-radius-md);
  transition: background 0.15s;
}
.img-prompt-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.prompt-box {
  display: none;
  margin-top: 12px;
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  padding: 10px 12px;
  font-size: 12px;
  color: var(--color-text-secondary);
  line-height: 1.6;
}
.prompt-box.show { display: block; }
.prompt-label { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
</style>
